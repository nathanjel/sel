# Answers certbot's HTTP-01 challenges for sel.spelnianiemarzenspzoo.com.
#
# certbot runs on the host (deploy/certbot/), in manual mode: its auth hook
# writes the challenge token into the sel-acme ConfigMap, which this nginx
# serves at /.well-known/acme-challenge/<token>. The Ingress claims only that
# path, and without the HTTPS redirect, so Let's Encrypt reaches it over plain
# HTTP while every other path of the site is redirected.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sel-acme
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sel-acme
spec:
  replicas: 1
  selector:
    matchLabels: {app: sel-acme}
  template:
    metadata:
      labels: {app: sel-acme}
    spec:
      containers:
      - name: web
        image: nginx:1-alpine
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
        volumeMounts:
        - name: tokens
          mountPath: /usr/share/nginx/html/.well-known/acme-challenge
          readOnly: true
      volumes:
      - name: tokens
        configMap: {name: sel-acme}
---
apiVersion: v1
kind: Service
metadata:
  name: sel-acme
spec:
  selector: {app: sel-acme}
  ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sel-acme
spec:
  ingressClassName: public
  rules:
  - host: sel.spelnianiemarzenspzoo.com
    http:
      paths:
      - path: /.well-known/acme-challenge
        pathType: Prefix
        backend:
          service:
            name: sel-acme
            port: {number: 80}
