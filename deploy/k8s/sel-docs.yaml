# The documentation site at https://sel.spelnianiemarzenspzoo.com, on the
# maintainer's microk8s. Not part of any package (export-ignored); the image is
# docs/Dockerfile's, pushed to the cluster's local registry:
#
#   docker build -f docs/Dockerfile -t localhost:32000/sel-docs:<version> .
#   docker push localhost:32000/sel-docs:<version>
#   (bump the image tag below)
#   sg microk8s -c "/snap/bin/microk8s kubectl apply -f deploy/k8s/sel-docs.yaml"
#
# HTTPS: cert-manager's `letsencrypt` ClusterIssuer (ACME HTTP-01, the same
# issuer the other sites on this cluster use) issues and renews sel-docs-tls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sel-docs
spec:
  replicas: 2
  selector:
    matchLabels: {app: sel-docs}
  template:
    metadata:
      labels: {app: sel-docs}
    spec:
      containers:
      - name: web
        image: localhost:32000/sel-docs:0.8.1
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 128Mi}
        readinessProbe:
          httpGet: {path: /, port: 80}
        livenessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sel-docs
spec:
  selector: {app: sel-docs}
  ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sel-docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: public
  tls:
  - hosts: [sel.spelnianiemarzenspzoo.com]
    secretName: sel-docs-tls
  rules:
  - host: sel.spelnianiemarzenspzoo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sel-docs
            port: {number: 80}
