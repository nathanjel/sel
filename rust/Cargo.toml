[package]
name = "sel-lang"
version = "0.10.0"
edition = "2021"
authors = ["Marcin Gałczyński <marcin@galczynski.pl>"]
description = "A small expression language for business rules: one rule gives the same answer in Python, JavaScript, PHP, C++23, Common Lisp, Rust and Go, or in your database as SQL. Exact decimal arithmetic, no floating point, no truthiness."
license = "MIT"
repository = "https://github.com/nathanjel/sel"
homepage = "https://github.com/nathanjel/sel"
readme = "README.md"
keywords = ["expression-language", "rules", "validation", "decimal", "sql"]
categories = ["parser-implementations", "database"]
# Measured: 1.85 is the oldest toolchain that builds the crate (std::ptr::fn_addr_eq).
rust-version = "1.85"
autobins = false
autoexamples = false
# What crates.io gets: the library, the `sel` CLI, and what describes them. The
# tests, the harness crate in dev/ and the build scripts stay in the repository.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[profile.release]
lto = "thin"
codegen-units = 1

# The core language needs only the regex crate. The SEL->SQL layer is opt-in
# in every host (spec'd in docs/internals/sql-translation.md); here it is the
# default-on `sql` feature, which brings the JSON reader its dialect map uses.
[features]
default = ["sql"]
sql = ["dep:serde", "dep:serde_json"]

[dependencies]
regex = "1.10"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

# The command-line tool: a REPL, `-e EXPR` for one-shot use, `--deps` for a
# program's inputs. `cargo install sel-lang` installs it.
[[bin]]
name = "sel"
path = "src/bin/sel.rs"

[dev-dependencies]
num-bigint = "0.5.1"

# The test harness, the worked examples and the benchmark hosts: dev/, never
# published (see dev/Cargo.toml).
[workspace]
members = ["dev"]
