[package]
name = "sel-lang"
version = "0.9.2"
edition = "2021"
authors = ["Marcin Gałczyński <marcin@galczynski.pl>"]
description = "A small expression language for validation rules."
license = "MIT"
autobins = false

[profile.release]
lto = "thin"
codegen-units = 1

# The core language needs only the regex crate. The SEL->SQL layer is opt-in
# in every host (spec'd in docs/internals/sql-translation.md); here it is the
# default-on `sql` feature, which brings the JSON reader its dialect map uses.
[features]
default = ["sql"]
sql = ["dep:serde", "dep:serde_json"]
# The database drivers of the LIVE worked examples (../examples/lib/db.rs), which
# tools/check-usage.sh builds in its image. Off by default: the library never
# needs them. rusqlite links the system libsqlite3 (the image's, which every
# other host there shares) rather than bundling its own; the mysql crate uses
# its pure-Rust deflate backend, so no zlib is linked either.
usage = ["sql", "dep:postgres", "dep:mysql", "dep:rusqlite"]

[dependencies]
regex = "1.10"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
postgres = { version = "0.19.14", optional = true }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust"], optional = true }
rusqlite = { version = "0.40.2", optional = true }

[[bin]]
name = "regex_verdict"
path = "src/bin/regex_verdict.rs"

[[bin]]
name = "scale_bench"
path = "src/bin/scale_bench.rs"
required-features = ["sql"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "sqlt"
path = "src/bin/sqlt.rs"
required-features = ["sql"]

[[bin]]
name = "map_replay"
path = "src/bin/map_replay.rs"
required-features = ["sql"]

[[bin]]
name = "check_decimal"
path = "src/bin/check_decimal.rs"

[[bin]]
name = "batch"
path = "src/bin/batch.rs"

[[bin]]
name = "e2e"
path = "src/bin/e2e.rs"

[[bin]]
name = "sel"
path = "src/bin/sel.rs"

[[bin]]
name = "sqlapi"
path = "src/bin/sqlapi.rs"
required-features = ["sql"]

[[bin]]
name = "api"
path = "src/bin/api.rs"

[dev-dependencies]
num-bigint = "0.5.1"

[[bin]]
name = "sqlfuzz"
path = "src/bin/sqlfuzz.rs"
required-features = ["sql"]

# The worked examples: one program per category under ../examples/, written in
# every host and diffed by tools/check-examples.sh (rust/build.sh publishes them
# as rust/build/example-<category>).
[[example]]
name = "plain"
path = "../examples/plain/rust.rs"

[[example]]
name = "complex"
path = "../examples/complex/rust.rs"

[[example]]
name = "repl"
path = "../examples/repl/rust.rs"

[[example]]
name = "validation"
path = "../examples/validation/rust.rs"

[[example]]
name = "scripting"
path = "../examples/scripting/rust.rs"

[[example]]
name = "sql"
path = "../examples/sql/rust.rs"
required-features = ["sql"]

[[example]]
name = "dialect"
path = "../examples/dialect/rust.rs"
required-features = ["sql"]

# The report over generated rows: examples/lib/render.rs, no database client.
[[example]]
name = "memory-complex"
path = "../examples/memory-complex/rust.rs"
required-features = ["sql"]

# The database-backed examples (the categories with a LIVE marker). They include
# ../examples/lib/db.rs and so need the drivers: tools/check-usage.sh builds them
# in its image with `--features usage`; rust/build.sh leaves them out.
[[example]]
name = "sql-3nf"
path = "../examples/sql-3nf/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-complex"
path = "../examples/sql-complex/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-conditions"
path = "../examples/sql-conditions/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-eav"
path = "../examples/sql-eav/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-flat"
path = "../examples/sql-flat/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-functions"
path = "../examples/sql-functions/rust.rs"
required-features = ["usage"]

[[example]]
name = "sql-star"
path = "../examples/sql-star/rust.rs"
required-features = ["usage"]
